<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Biblioteca B&B </h1>
        <nav>
            <button onclick="mostrarSecao('cadastro')">Cadastrar Livro</button>
            <button onclick="mostrarSecao('listar')">Listar Livros</button>
            <button onclick="mostrarSecao('buscar')">Buscar Livro</button>
            <button onclick="mostrarSecao('emprestimo')">Emprestar Livros</button>
        </nav>
    </header>

    <main>
        
        <section id="cadastro" class="secao ativa">
            <h2>Cadastrar Livro</h2>
            <form id="formCadastro">
                <label>Título:</label>
                <input type="text" id="titulo" required><br>
                <label>Autor:</label>
                <input type="text" id="autor" required><br>
                <label>Ano:</label>
                <input type="number" id="ano" required><br>
                <button type="submit">Registrar</button>
            </form>
            <p id="mensagem"></p>
        </section>

        <section id="listar" class="secao">
            <h2>Livros Cadastrados</h2>
            <ul id="listaLivros"></ul>
        </section>

        <section id="buscar" class="secao">
            <h2>Buscar Livro</h2>
            <input type="text" id="buscaInput" placeholder="Digite o título...">
            <button onclick="buscarLivro()">Buscar</button>
            <ul id="resultadoBusca"></ul>
        </section>

        <section id="emprestimo" class="secao">
            <h2>Emprestar Livro</h2>
            <form id="formEmprestimo">
                <label>Título do Livro:</label>
                <input type="text" id="tituloEmprestimo" required><br>
                <label>Nome do Usuário:</label>
                <input type="text" id="usuarioEmprestimo" required><br>
                <label>Dias de Empréstimo:</label>
                <input type="number" id="diasEmprestimo" min="1" required><br>
                <button type="submit">Registrar Empréstimo</button>
            </form>

            <h3>Empréstimos Ativos</h3>
            <ul id="listaEmprestimos"></ul>

            <h3>Devolver Livro</h3>
            <input type="text" id="tituloDevolucao" placeholder="Título para devolução...">
            <button onclick="devolverLivro()">Devolver</button>

            <p id="mensagemEmprestimo"></p>
        </section>
    </main>
    <script src="script.js"></script>

</body>
</html>
